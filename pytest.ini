[pytest]
testpaths = tests
pythonpath = .
addopts = -v -s
asyncio_default_fixture_loop_scope = function
markers =
    smoke: Smoke test suite for quick authentication and critical paths
    flaky: Tests that validate flakiness fixes and retries
    tenant: Tests verifying multi-tenant data boundary isolation
    integration: End-to-end API and UI multi-platform tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
