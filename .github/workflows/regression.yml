name: QA Automation Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Daily Nightly Run

jobs:
  test:
    name: Run Pytest & Playwright Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Framework Syntax & Collect Test Suites
        env:
          PYTHONPATH: .
        run: |
          pytest --collect-only

      - name: Execute Automated Test Suite (Staging Environment)
        continue-on-error: true
        env:
          PYTHONPATH: .
          TEST_ENV: staging
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          pytest -v --html=reports/report.html --self-contained-html || true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-report
          path: reports/report.html
